services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcf
      POSTGRES_PASSWORD: dcf
      POSTGRES_DB: dcf
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcf"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dcf:dcf@postgres:5432/dcf
      SESSION_SECRET: ${SESSION_SECRET:-dev-compose-secret}
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_LOGO_TOKEN: ${NEXT_PUBLIC_LOGO_TOKEN:-}
    environment:
      NEXT_PUBLIC_API_URL: ""
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
